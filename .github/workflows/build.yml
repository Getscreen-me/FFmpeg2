name: Build Minimal FFmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout FFmpeg tag
        run: |
          git fetch --tags
          git checkout n8.1.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            yasm \
            nasm

      - name: Configure
        run: |
          ./configure \
            --prefix="$GITHUB_WORKSPACE/build" \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --disable-shared \
            --enable-static

      - name: Build
        run: |
          make -j$(nproc)
          make install

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-n8.1.2-linux
          path: |
            build/bin/ffmpeg
            build/bin/ffprobe