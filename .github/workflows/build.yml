name: Build Minimal FFmpeg

on:
  workflow_dispatch:
    inputs:
      branch-name:
        required: true
        type: string
        default: n9.0

jobs:
  build:
    runs-on: [ self-hosted, Linux, X64 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout FFmpeg
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch-name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            yasm \
            nasm

      - name: Configure
        run: |
          # запускаем конфигуратор FFmpeg и генерируем Makefile
          ./configure \
            \
            # каталог установки для команды "make install"
            --prefix="$GITHUB_WORKSPACE/build" \
            \
            # отключить все компоненты FFmpeg
            --disable-everything \
            \
            # собрать только утилиту ffmpeg
            --enable-ffmpeg \
            \
            # не собирать видеоплеер
            --disable-ffplay \
            \
            # не собирать утилиту анализа медиафайлов
            --disable-ffprobe \
            \
            # не генерировать документацию (man/html)
            --disable-doc \
            \
            # отключить отладочную информацию
            --disable-debug \
            \
            # отключить поддержку сетевых протоколов (HTTP, RTSP, RTP, FTP и т.д.)
            --disable-network \
            \
            # не искать автоматически внешние библиотеки в системе
            --disable-autodetect \
            \
            # отключить все устройства ввода (камера, экран, микрофон и т.д.)
            --disable-indevs \
            \
            # отключить все устройства вывода
            --disable-outdevs \
            \
            # отключить все фильтры (масштабирование, обрезка, поворот и т.д.)
            --disable-filters \
            \
            # отключить все bitstream-фильтры
            --disable-bsfs \
            \
            # отключить аппаратное ускорение (VAAPI, CUDA, QSV и др.)
            --disable-hwaccels \
            \
            # не использовать iconv
            --disable-iconv \
            \
            # не использовать zlib
            --disable-zlib \
            \
            # не использовать bzip2
            --disable-bzlib \
            \
            # не использовать liblzma (xz)
            --disable-lzma \
            \
            # собирать только статические библиотеки
            --disable-shared \
            --enable-static \
            \
            # оставить только работу с локальными файлами
            --enable-protocol=file \
            \
            # поддержка контейнеров MP4/MOV (чтение)
            --enable-demuxer=mov \
            \
            # поддержка контейнеров MKV и WebM (чтение)
            --enable-demuxer=matroska \
            \
            # поддержка контейнера OGG (чтение)
            --enable-demuxer=ogg \
            \
            # поддержка контейнера MP4 (запись)
            --enable-muxer=mp4 \
            \
            # парсер H.264 (AVC)
            --enable-parser=h264 \
            \
            # парсер H.265 (HEVC)
            --enable-parser=hevc \
            \
            # парсер VP8
            --enable-parser=vp8 \
            \
            # парсер VP9
            --enable-parser=vp9 \
            \
            # парсер AAC
            --enable-parser=aac \
            \
            # парсер Opus
            --enable-parser=opus \
            \
            # парсер Vorbis
            --enable-parser=vorbis

      - name: Build
        run: |
          make -j$(nproc)

      - name: Upload ffmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-n8.1.2-linux
          path: ffmpeg
