name: Build Minimal FFmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout FFmpeg
        uses: actions/checkout@v4
        with:
          ref: n8.1.2
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            yasm \
            nasm

      - name: Configure
        run: |
          # запускаем конфигуратор FFmpeg и генерируем Makefile
          ./configure \
            --prefix="$GITHUB_WORKSPACE/build" \
            \
            # отключить всё
            --disable-everything \
            \
            # включить сборку ffmpeg
            --enable-ffmpeg \
            \
            # не собирать ffplay
            --disable-ffplay \
            \
            # не собирать ffprobe
            --disable-ffprobe \
            \
            # не генерировать документацию (man)
            --disable-doc \
            \
            # отключить отладочную информацию
            --disable-debug \
            \
            # отключить сетевые протоколы (работа только с локальными файлами)
            --disable-network \
            \
            # собирать только статические библиотеки
            --disable-shared \
            --enable-static \
            \
            # оставить только файловый протокол
            --enable-protocol=file \
            \
            # поддержка контейнера MP4
            --enable-demuxer=mov \
            --enable-muxer=mp4 \
            \
            # парсеры необходимых кодеков
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=aac

      - name: Build
        run: |
          make -j$(nproc)
          make install

      - name: Upload ffmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-n8.1.2-linux
          path: |
            build/bin/ffmpeg
