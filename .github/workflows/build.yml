name: Build Minimal FFmpeg

on:
  workflow_dispatch:
    inputs:
      branch-name:
        required: true
        type: string
        default: n9.0

jobs:
  build:
    runs-on: [ self-hosted, Linux, X64 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout FFmpeg
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch-name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            yasm \
            nasm

      - name: Configure
        run: |
          # Запускаем конфигуратор FFmpeg и генерируем Makefile.
          #
          # Каталог установки для команды "make install".
          #
          # Отключить все компоненты FFmpeg.
          #
          # Явно отключить все категории компонентов.
          # Эти параметры уже покрываются --disable-everything и не уменьшают
          # размер бинарника дополнительно. Они оставлены для наглядности.
          #
          # Собрать только утилиту ffmpeg.
          #
          # Не собирать ffplay (видеоплеер).
          #
          # Не собирать ffprobe (утилиту анализа медиафайлов).
          #
          # Не генерировать документацию (man/html).
          #
          # Отключить отладочную информацию.
          #
          # Отключить поддержку сетевых протоколов
          # (HTTP, HTTPS, RTSP, RTP, FTP и др.).
          #
          # Не искать автоматически внешние библиотеки в системе.
          #
          # Отключить все устройства ввода
          # (камера, экран, микрофон и т.д.).
          #
          # Отключить все устройства вывода.
          #
          # Отключить все фильтры
          # (масштабирование, поворот, обрезка и т.д.).
          #
          # Отключить все bitstream-фильтры.
          #
          # Отключить аппаратное ускорение
          # (CUDA, VAAPI, QSV и др.).
          #
          # Не использовать iconv.
          #
          # Не использовать zlib.
          #
          # Не использовать bzip2.
          #
          # Не использовать liblzma (XZ).
          #
          # Не собирать libswscale
          # (масштабирование и преобразование форматов изображения).
          #
          # Не собирать libswresample
          # (ресемплинг и преобразование аудио).
          #
          # Не собирать libavdevice
          # (работа с устройствами: камеры, микрофоны и т.д.).
          #
          # Отключить поддержку GPL-компонентов.
          #
          # Отключить поддержку LGPLv3/GPLv3-компонентов.
          #
          # Не генерировать HTML-документацию.
          #
          # Не генерировать man-страницы.
          #
          # Не генерировать POD-документацию.
          #
          # Не генерировать TXT-документацию.
          #
          # Отключить поддержку многопоточности (pthreads).
          #
          # Отключить определение возможностей процессора во время выполнения. Набор инструкций (SSE, AVX и др.) будет определён во время компиляции.
          #
          # Собирать только статические библиотеки.
          #
          # Оставить только работу с локальными файлами.
          #
          # Поддержка контейнеров MP4/MOV (чтение).
          #
          # Поддержка контейнеров MKV/WebM (чтение).
          #
          # Поддержка контейнера OGG (чтение).
          #
          # Поддержка контейнера MP4 (запись).
          #
          # Парсеры видео:
          #   H.264 (AVC)
          #   H.265 (HEVC)
          #   VP8
          #   VP9
          #
          # Парсеры аудио:
          #   AAC
          #   Opus
          #   Vorbis
          ./configure \
            --prefix="$GITHUB_WORKSPACE/build" \
            --disable-everything \
            --disable-filters \
            --disable-bsfs \
            --disable-protocols \
            --disable-demuxers \
            --disable-muxers \
            --disable-parsers \
            --disable-encoders \
            --disable-decoders \
            --enable-ffmpeg \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-autodetect \
            --disable-indevs \
            --disable-outdevs \
            --disable-hwaccels \
            --disable-iconv \
            --disable-zlib \
            --disable-bzlib \
            --disable-lzma \
            --disable-shared \
            --disable-swscale \
            --disable-swresample \
            --disable-avdevice \
            --disable-gpl \
            --disable-version3 \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-pthreads \
            --disable-runtime-cpudetect \
            --enable-static \
            --enable-protocol=file \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-demuxer=ogg \
            --enable-muxer=mp4 \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=vp8 \
            --enable-parser=vp9 \
            --enable-parser=aac \
            --enable-parser=opus \
            --enable-parser=vorbis

      - name: Build
        run: |
          make -j$(nproc)
          strip ffmpeg

      - name: Upload ffmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-n8.1.2-linux
          path: ffmpeg
